# Address labels Ferret uses to name the end of a trail.
#
# Every label says where it came from and how sure it is. Ferret shows both
# next to the label, because deposit addresses and clustering can be wrong.
#
# kind        exchange-deposit | exchange-hot | mixer | bridge | sanctioned | reported-scam
# confidence  low | medium | high
# source      where the label came from, in words a person can check
# seen        how it was confirmed on-chain, if it was

